[tool.poetry]
name = "vehicle-number-plate-detection"
version = "1.0.0"
description = "Vehicle Number Plate Detection with OCR"
authors = ["AyushTiwani080"]

[tool.poetry.dependencies]
python = "^3.11"
Flask = "3.0.0"
opencv-python-headless = "4.8.1.78"
numpy = "<2"
imutils = "0.5.4"
easyocr = "1.7.0"
torch = ">=2.2.0"
torchvision = ">=0.17.0"
Pillow = ">=10.4.0"
python-dotenv = "1.0.0"
gunicorn = "21.2.0"
Flask-CORS = "4.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

